# SarSat 200-satellite collection-modes benchmark (sarsat.quality.WindowedQualitySarSat): the
# sarsat-200sat-events field (200 satellites in 20 Walker planes, 6,000 persistent background
# targets, 40 event clusters of 50 targets at priority x10, each open for one 10-30 step
# window, 10% sustainable duty cycle) with the four SAR modes and image-quality requirements of
# sarsat-100sat-modes: each event draws one quality level for all its targets and each
# background target its own, and the clusters are 30 km across (one-sigma) so a ScanSAR swath
# can hold one (DECISIONS.md issues 32 and 35).
name: SarSat
task_name: sarsat-200sat-modes
task_config:
  num_satellites: 200
  max_targets: 8000
  hotspots: 40
  hotspot_targets: 50
  hotspot_weight: 10.0
  hotspot_radius_km: 30.0
  planes: 20
  window_steps: [10, 30]
  background_windows: false
  recharge_rate: 0.01
  hotspot_quality: [1.0, 3.0, 5.0, 7.0]       # ScanSAR, stripmap, spotlight, staring grade
  background_quality: [1.0, 3.0, 5.0]
  background_quality_weights: [0.4, 0.4, 0.2]
  # Cheapest first, so the greedy reference picks the cheapest mode that is good enough.
  # beam_half_width_deg is (cross-track, squint): about 0.036 deg per km of swath width and
  # 0.043 deg per km of scene length at ~550 km.
  modes:
    - {name: stripmap, sense_cost: 0.10, quality: 3.5, duration_s: 10.0,
       incidence_deg: [20.0, 45.0], max_squint_deg: 20.0, beam_half_width_deg: [1.0, 2.0]}
    - {name: spotlight, sense_cost: 0.13, quality: 5.0, duration_s: 10.0,
       incidence_deg: [15.0, 55.0], max_squint_deg: 25.0, beam_half_width_deg: [0.2, 0.2]}
    - {name: scansar, sense_cost: 0.20, quality: 1.5, duration_s: 25.0,
       incidence_deg: [20.0, 45.0], max_squint_deg: 20.0, beam_half_width_deg: [3.6, 4.0]}
    - {name: staring, sense_cost: 0.30, quality: 7.0, duration_s: 45.0,
       incidence_deg: [20.0, 50.0], max_squint_deg: 15.0, beam_half_width_deg: [0.15, 0.15]}
