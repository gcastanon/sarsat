# SarSat 500-satellite event benchmark (sarsat.windows.WindowedSarSat): 500 satellites in
# 50 Walker planes of 10, 15,000 persistent background targets and 100 event clusters of 50
# targets (priority x10), each open for one 10-30 step window, with a 5% sustainable duty
# cycle (recharge_rate 0.005). The 200-satellite field scaled by 2.5x, and half the duty
# cycle: with a full charge worth only 11 looks and one look regained every 20 steps, a
# satellite that spends on the background is not charged when the event only it can reach
# in time opens, and which event that is depends on what its teammates will cover. Seeds
# 1000-1015: greedy_beam 0.394, coop_dedup 0.432 (same-step cooperation alone, +10%),
# solo_plan 0.658 (temporal planning, +67%), coop_plan 0.883 (cooperation on top, +34%),
# each ahead on all 16 seeds: DECISIONS.md issue 26.
name: SarSat
task_name: sarsat-500sat-events
task_config:
  num_satellites: 500
  max_targets: 20000
  hotspots: 100
  hotspot_targets: 50
  hotspot_weight: 10.0
  planes: 50
  window_steps: [10, 30]
  background_windows: false
  recharge_rate: 0.005
